function confirmApptAssessment(apptId){
  const appt=DB.appointments.find(function(a){return a.id===apptId;});
  const r=DB.requests.find(function(x){return x.id===appt.requestId;});
  const income=+document.getElementById('apptassess_income').value||0, expense=+document.getElementById('apptassess_expense').value||0, debt=+document.getElementById('apptassess_debt').value||0;
  const fra=currentFraTotal('apptassess');
  const s=computeScoreFrom({income:income,expense:expense,debt:debt,fra:fra});
  const nextNo=(r.usedQty||0)+1;
  const nowIso=new Date().toISOString();
  const snap={visitNo:nextNo,date:nowIso,retained:false,income:income,expense:expense,debt:debt,fra:fra,net:s.net,copay:s.copay,total:s.total,group:s.group,savedBy:'สมหญิง มีใจ (นักสังคมสงเคราะห์)',source:'appointment',apptId:appt.id};
  r.redemptions.push(snap);
  r.usedQty=(r.usedQty||0)+1;
  r.history.push({type:'redeem',label:'ใช้สิทธิครั้งที่ '+snap.visitNo+' — ประเมินผ่านนัดหมาย '+appt.id,ts:nowIso,actor:snap.savedBy});
  const remain=r.approvedQty-r.usedQty;
  if(remain<=0){
    r.status='Off'; DB.cases[r.hn].status='Off';
    r.history.push({type:'close',label:'ปิดเคสอัตโนมัติ (Off) — ใช้สิทธิครบตามจำนวนที่อนุมัติ',ts:new Date().toISOString(),actor:'ระบบ'});
  }
  appt.stageIndex=1; appt.stageLog.push({stage:'Assessment',ts:nowIso}); appt.status='InProgress';
  closeModal();
  toast('success','บันทึกผลประเมิน + ใช้สิทธิครั้งที่ '+snap.visitNo+' สำเร็จ');
  render();
  openApptTimeline(apptId);
}

    '<div class="banner banner--info" style="margin:16px 20px 0"><span class="icon" data-icon="circle-info"></span><div><strong>รายชื่อผู้ป่วยที่ต้องติดตามเยี่ยมบ้าน</strong><p>เมื่อบันทึกผลเยี่ยมบ้านแล้ว รายการจะออกจากหน้านี้โดยอัตโนมัติ และผลประเมิน SMDA ใหม่จะถูกเพิ่มเข้าประวัติ/Timeline ของเคสนั้น (ไม่กระทบโควตา Used/Remaining)</p></div></div>'+
    '<div style="overflow-x:auto;margin-top:12px"><table class="wl"><thead><tr><th>เลขที่คำขอ</th><th>ผู้ป่วย</th><th>เหตุผลที่ต้องติดตาม</th><th>เหตุการณ์ล่าสุด</th><th>สถานะ</th><th>Action</th></tr></thead><tbody>'+
    (rows||'<tr><td colspan="6"><div class="emptywrap"><span class="icon" data-icon="circle-check" data-size="26"></span><div>ไม่มีรายการที่ต้องติดตามในขณะนี้</div></div></td></tr>')+
    '</tbody></table></div>';
}
function openFollowUpDrawer(id){
  const r=DB.requests.find(function(x){return x.id===id;});
  const p=getPatient(r.hn);
  const series=assessmentSeriesFor(r);
  const last=series.length? series[series.length-1] : {income:0,expense:0,debt:0,fra:0};
  const html='<div class="drawer-head"><h3>บันทึกเยี่ยมบ้าน (ติดตาม) · '+r.id+'</h3><button class="iconbtn" onclick="closeDrawer()" data-fa="fa-solid fa-xmark"><span class="icon" data-icon="xmark"></span></button></div>'+
    '<div class="drawer-body vstack">'+
      '<div class="banner banner--info"><span class="icon" data-icon="circle-info"></span><div><strong>'+r.followUpReason+'</strong><p>บันทึกนี้จะเพิ่มผลประเมิน SMDA ใหม่เข้าประวัติของเคส และไม่กระทบโควตา Used/Remaining (เช่นเดียวกับเยี่ยมบ้านทั่วไป)</p></div></div>'+
      '<div class="form-grid">'+
        '<div class="field"><label>วันที่เยี่ยม</label><input class="input" type="date" id="fuDate" value="'+DEFAULT_APPT_DATE+'"></div>'+
        '<div class="field"><label>ที่อยู่ (จาก SMDA)</label><input class="input" id="fuAddress" value="'+p.address+'"></div>'+
      '</div>'+
      '<div class="field"><label>ผลการเยี่ยมบ้าน / ข้อค้นพบ <span style="color:var(--color-status-critical)">*</span></label><textarea class="textarea" id="fuFindings" placeholder="สภาพความเป็นอยู่ ผู้ดูแล การเปลี่ยนแปลงฐานะเศรษฐกิจ ฯลฯ"></textarea></div>'+
      '<div class="section"><div class="section-head" data-toggle-section><h3>ปรับปรุงผลประเมิน SMDA/FRA</h3><span class="sub">ดึงค่าล่าสุดมาเป็นค่าเริ่มต้น แก้ไขได้</span><span class="icon chev" data-icon="chevron-down"></span></div><div class="section-body">'+ecoFormHtml('fu',last)+'<div style="margin-top:12px">'+fraFormHtml('fu',last.fra)+'</div><div style="margin-top:12px">'+scoreInstrumentHtml('fu',computeScoreFrom(last))+'</div></div></div>'+
      '<div class="field"><label>การยินยอมของผู้ป่วย/ญาติ (Consent) <span style="color:var(--color-status-critical)">*</span></label>'+
        '<div class="sig-wrap"><canvas id="sigPad_fu" class="sig-canvas" width="460" height="150"></canvas></div>'+
        '<div class="hstack" style="margin-top:6px"><button type="button" class="btn btn--quiet btn--sm" onclick="clearSigPad(\'sigPad_fu\')">ล้างลายเซ็น</button></div>'+
        '<div class="field" style="margin-top:8px"><label>ชื่อผู้ลงนาม</label><input class="input" id="fuSignName" value="'+p.name+'"></div>'+
      '</div>'+
    '</div>'+
    '<div class="drawer-foot"><button class="btn btn--secondary" onclick="closeDrawer()">ยกเลิก</button><button class="btn btn--primary" onclick="confirmFollowUpVisit(\''+id+'\')" data-fa="fa-solid fa-floppy-disk"><span class="icon" data-icon="floppy-disk"></span>บันทึกผลเยี่ยมบ้าน</button></div>';
  openDrawer(html);
  initSigPad('sigPad_fu');
}
function confirmFollowUpVisit(id){
  const findings=document.getElementById('fuFindings').value.trim();
  if(!findings){ toast('error','กรุณาระบุผลการเยี่ยมบ้าน'); document.getElementById('fuFindings').classList.add('has-error'); return; }
  if(!hasSignature('sigPad_fu')){ toast('error','กรุณาให้ผู้ป่วย/ญาติลงนามยินยอมก่อนบันทึก'); return; }
  const r=DB.requests.find(function(x){return x.id===id;});
  const income=+document.getElementById('fu_income').value||0, expense=+document.getElementById('fu_expense').value||0, debt=+document.getElementById('fu_debt').value||0;
  const fra=currentFraTotal('fu');
  const s=computeScoreFrom({income:income,expense:expense,debt:debt,fra:fra});
  const date=document.getElementById('fuDate').value;
  const nowIso=new Date().toISOString();
  const hv={date:new Date(date+'T13:00:00').toISOString(),address:document.getElementById('fuAddress').value,findings:findings,by:'สมหญิง มีใจ (นักสังคมสงเคราะห์)',
    econSnapshot:{income:income,expense:expense,debt:debt,fra:fra,net:s.net,copay:s.copay,total:s.total,group:s.group},
    consent:{dataUrl:captureSignature('sigPad_fu'),name:document.getElementById('fuSignName').value||getPatient(r.hn).name,ts:nowIso}};
  r.homeVisits.push(hv);
  r.history.push({type:'homevisit',label:'บันทึกเยี่ยมบ้าน + ปรับปรุงผลประเมิน SMDA (ติดตาม)',ts:hv.date,actor:hv.by});
  r.needsFollowUp=false; r.followUpReason=null;
  closeDrawer();
  toast('success','บันทึกผลเยี่ยมบ้านและผลประเมินใหม่สำเร็จ · ออกจากรายการติดตามแล้ว');
  render();
}
</script>

<script>
/* ---------------- EXECUTIVE: approval inbox + review ---------------- */
function viewExecInbox(){
  const list = DB.requests.filter(function(r){return r.status==='PendingApproval';}).sort(function(a,b){return new Date(a.createdAt)-new Date(b.createdAt);});
  const rows = list.map(function(r){
    const p=getPatient(r.hn); const total=r.items.reduce(function(s,it){return s+it.qty*it.priceFull;},0);
    const s=computeScoreFrom(r.assessment);
    return '<tr><td class="cid">'+r.id+'</td><td><div class="pname">'+p.name+'</div><div class="phn">HN '+p.hn+'</div></td>'+
      '<td class="reason">'+r.items.map(function(i){return i.name+' ×'+i.qty;}).join(', ')+'</td>'+
      '<td class="money">฿'+fmtMoney(total)+'</td>'+
      '<td><span class="badge badge--group-'+s.group+'">'+groupLabel(s.group)+'</span></td>'+
      '<td>'+fmtDate(r.createdAt)+'</td>'+
      '<td class="rowaction"><button class="btn btn--primary btn--sm" onclick="openExecReview(\''+r.id+'\')">พิจารณาอนุมัติ</button></td></tr>';
  }).join('');
  return '<div class="page-context"><div><div class="breadcrumb">ผู้บริหาร</div><h1 class="page-title">รออนุมัติคำขอสงเคราะห์</h1></div>'+
    '<div class="context-right"><span class="badge badge--warning">'+list.length+' รายการรอพิจารณา</span></div></div>'+
    '<div class="content">'+
    '<div class="banner banner--info"><span class="icon" data-icon="circle-info"></span><div><strong>อำนาจ/เกณฑ์การอนุมัติยังไม่ยืนยันจากโรงพยาบาล (TBD-04)</strong><p>ต้นแบบนี้จำลองการอนุมัติเป็นระดับเดียว (ผู้บริหาร 1 บทบาท) โดยไม่ผูก threshold มูลค่า — WA-04</p></div></div>'+
    '<div class="section"><div class="section-body" style="padding:0"><div style="overflow-x:auto"><table class="wl"><thead><tr><th>เลขที่</th><th>ผู้ป่วย</th><th>รายการ</th><th>มูลค่าที่ขอ</th><th>ผลประเมิน (กลุ่มสี)</th><th>ส่งเมื่อ</th><th>Next Action</th></tr></thead><tbody>'+
    (rows||'<tr><td colspan="7"><div class="emptywrap">ไม่มีรายการรออนุมัติ</div></td></tr>')+
    '</tbody></table></div></div></div></div>';
}
function openExecReview(id){ STATE.view='exec-review'; STATE.activeId=id; render(); }
function viewExecReview(){
  const r = DB.requests.find(function(x){return x.id===STATE.activeId;});
  const s=computeScoreFrom(r.assessment);
  return '<div class="page-context"><div><div class="breadcrumb">รออนุมัติ / '+r.id+'</div><h1 class="page-title">พิจารณาอนุมัติคำขอสงเคราะห์</h1></div>'+
    '<div class="context-right"><button class="btn btn--quiet" onclick="goto(\'exec-inbox\')" data-fa="fa-solid fa-chevron-left"><span class="icon" data-icon="chevron-left"></span>กลับ</button></div></div>'+
    patientBanner(r.hn)+
    '<div class="content">'+
      '<div class="instrument"><b>คำขอจาก '+r.doctor+' ('+r.doctorLevel+')</b><p style="margin-top:6px">'+r.reason+'</p></div>'+
      '<div class="section" style="margin-top:16px"><div class="section-head"><h3>รายการที่ขอสงเคราะห์</h3></div><div class="section-body">'+itemsBlock(r.items)+'</div></div>'+
      '<div class="section"><div class="section-head"><h3>ผลประเมินจากนักสังคมสงเคราะห์</h3><span class="sub">บันทึกเมื่อ '+fmtDateTime(r.assessment.savedAt)+'</span></div><div class="section-body">'+scoreInstrumentHtml('exec',s)+
        '<div class="prior-card" style="margin-top:12px"><div class="kv"><span class="k">รหัส ICD-10 Z</span><span class="v" style="font-family:inherit;font-weight:600">'+r.assessment.codes.icdz+'</span></div><div class="kv"><span class="k">ระดับความเสี่ยง</span><span class="v" style="font-family:inherit;font-weight:600">'+r.assessment.codes.risk+'</span></div></div>'+
      '</div></div>'+
      '<div class="section"><div class="section-head"><h3>การตัดสินใจ</h3></div><div class="section-body vstack">'+
        '<div class="seg" id="decisionSeg"><button type="button" class="is-active" onclick="setDecision(\'approve\',this)">อนุมัติ</button><button type="button" onclick="setDecision(\'reject\',this)">ปฏิเสธ</button></div>'+
        '<div id="approveFields" class="form-grid">'+
          '<div class="field"><label>จำนวนครั้งที่อนุมัติ</label><input class="input" id="apprQty" type="number" min="1" value="'+r.items[0].qty+'" oninput="updApprovedValue()"></div>'+
          '<div class="field"><label>มูลค่าที่อนุมัติ (คำนวณอัตโนมัติ)</label><input class="input" id="apprValue" value="฿'+fmtMoney(r.items[0].qty*r.items[0].priceFull)+'" disabled></div>'+
        '</div>'+
        '<div id="rejectFields" style="display:none" class="field"><label>เหตุผลการปฏิเสธ <span style="color:var(--color-status-critical)">*</span></label><textarea class="textarea" id="rejReason" placeholder="ระบุเหตุผล เช่น งบประมาณ/เอกสารไม่ครบ"></textarea></div>'+
        '<div class="hstack" style="justify-content:flex-end"><button class="btn btn--primary" onclick="commitDecision(\''+r.id+'\')" id="decisionBtn" data-fa="fa-solid fa-circle-check"><span class="icon" data-icon="circle-check"></span>ยืนยันการอนุมัติ</button></div>'+
      '</div></div>'+
    '</div>';
}
function setDecision(d,btn){
  window.__execDecision=d;
  btn.parentElement.querySelectorAll('button').forEach(function(b){b.classList.remove('is-active');});
  btn.classList.add('is-active');
  document.getElementById('approveFields').style.display = d==='approve'?'grid':'none';
  document.getElementById('rejectFields').style.display = d==='reject'?'block':'none';
  document.getElementById('decisionBtn').innerHTML = ic('circle-check')+(d==='approve'?'ยืนยันการอนุมัติ':'ยืนยันการปฏิเสธ');
}
function updApprovedValue(){
  const r = DB.requests.find(function(x){return x.id===STATE.activeId;});
  const qty=+document.getElementById('apprQty').value||0;
  document.getElementById('apprValue').value='฿'+fmtMoney(qty*r.items[0].priceFull);
}
window.__execDecision='approve';
function commitDecision(id){
  const r = DB.requests.find(function(x){return x.id===id;});
  if(window.__execDecision==='approve'){
    const qty=+document.getElementById('apprQty').value||1;
    if(!confirm('ยืนยันอนุมัติ '+qty+' ครั้ง มูลค่า ฿'+fmtMoney(qty*r.items[0].priceFull)+' ใช่หรือไม่?')) return;
    r.status='Approved'; r.approvedQty=qty; r.usedQty=0;
    r.approval={approver:'ผอ.ประเสริฐ ศรีสมบูรณ์ (ผู้อำนวยการ)',approvedAt:new Date().toISOString(),note:'อนุมัติผ่านหน้าจอพิจารณา'};
    r.history.push({type:'approve',label:'อนุมัติ '+qty+' ครั้ง มูลค่า ฿'+fmtMoney(qty*r.items[0].priceFull),ts:new Date().toISOString(),actor:r.approval.approver});
    toast('success','อนุมัติคำขอ '+r.id+' สำเร็จ · เปิดโควตา '+qty+' ครั้ง');
  } else {
    const reason=document.getElementById('rejReason').value.trim();
    if(!reason){ toast('error','กรุณาระบุเหตุผลการปฏิเสธ'); document.getElementById('rejReason').classList.add('has-error'); return; }
    r.status='Rejected';
    r.approval={approver:'ผอ.ประเสริฐ ศรีสมบูรณ์ (ผู้อำนวยการ)',rejectedAt:new Date().toISOString(),reason:reason};
    r.history.push({type:'reject',label:'ปฏิเสธคำขอ — '+reason,ts:new Date().toISOString(),actor:r.approval.approver});
    toast('success','บันทึกผลปฏิเสธคำขอ '+r.id+' แล้ว');
  }
  goto('exec-inbox');
}
</script>

<script>

    .concat(DB.requests.map(function(r){return {kind:'Request',status:r.status,hn:r.hn,createdAt:r.createdAt};}));
  const byStatus={};
  all.forEach(function(x){ byStatus[x.kind+' · '+x.status]=(byStatus[x.kind+' · '+x.status]||0)+1; });
  const rows=Object.keys(byStatus).sort().map(function(k){return '<tr><td>'+k+'</td><td class="money">'+byStatus[k]+'</td></tr>';}).join('');
  return '<div class="page-context"><div><div class="breadcrumb">รายงาน</div><h1 class="page-title">รายงานสรุปงานสังคมสงเคราะห์</h1></div></div>'+
    '<div class="content">'+
    '<div class="banner banner--info"><span class="icon" data-icon="circle-info"></span><div><strong>ขอบเขต Prototype</strong><p>แสดงสรุปจำนวนตามประเภท/สถานะเป็นตัวอย่าง — ชุดฟิลด์รายงานฉบับเต็มตามข้อ ๒๐ ของ Blueprint (วันที่, เพศ, อายุ, คะแนน, หน่วยงานที่ส่ง Consult ฯลฯ) ยังไม่ได้ลงรายละเอียดครบใน Prototype นี้</p></div></div>'+
    '<div class="section"><div class="section-head"><h3>สรุปจำนวนตามประเภท/สถานะ</h3></div><div class="section-body" style="padding:0"><table class="wl"><thead><tr><th>ประเภท · สถานะ</th><th>จำนวน</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    '</div>';
}
</script>

<script>
/* ---------------- Modal / Drawer / Toast infra + Demo Guide ---------------- */
function openDrawer(html){
  const w=document.getElementById('drawerWrap');
  w.innerHTML='<div class="drawer-back" onclick="closeDrawer()"></div><div class="drawer">'+html+'</div>';
  w.classList.add('is-open');
  hydrateIcons(w);
}
function closeDrawer(){ document.getElementById('drawerWrap').classList.remove('is-open'); document.getElementById('drawerWrap').innerHTML=''; }
function toast(kind,msg){
  const wrap=document.getElementById('toastWrap');
  const el=document.createElement('div');
  el.className='toast'+(kind==='error'?' is-error':' is-success');
  el.innerHTML='<span class="icon" data-icon="'+(kind==='error'?'circle-exclamation':'circle-check')+'"></span><span>'+msg+'</span>';
  wrap.appendChild(el);
  hydrateIcons(el);
  setTimeout(function(){ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(function(){el.remove();},320); },3600);
}
function openGuide(){
  const html='<div class="modal-head"><h3>คู่มือสาธิต</h3><button class="iconbtn" onclick="closeModal()" data-fa="fa-solid fa-xmark"><span class="icon" data-icon="xmark"></span></button></div>'+
  '<div class="modal-body vstack">'+
    '<p><b>วัตถุประสงค์:</b> สาธิต 2 กระบวนงานหลักของงานสังคมสงเคราะห์ — Consult (ขอคำปรึกษา) และ Request (ขอสงเคราะห์ค่ารักษา พร้อม Approval และโควตาใช้ซ้ำ)</p>'+
    '<p><b>ทางลัดเริ่มต้น:</b> ใช้ตัวเลือก "บทบาท" มุมขวาบนเพื่อสลับมุมมอง แพทย์ → นักสังคมสงเคราะห์ → ผู้บริหาร</p>'+
    '<p><b>Consult:</b> บทบาทแพทย์ → ส่งปรึกษาใหม่ → สลับเป็นนักสังคมสงเคราะห์ → แท็บ "ปรึกษา" → เปิดรายการใหม่ → ประเมิน → ตอบกลับ</p>'+
    '<p><b>Request + โควตา:</b> บทบาทแพทย์ (Staff) → ขอสงเคราะห์ใหม่ → กรอกรายการ → ส่ง → สลับเป็นนักสังคมสงเคราะห์ → แท็บ "คำขอสงเคราะห์" → ประเมิน SMDA/FRA → ส่งอนุมัติ → สลับเป็นผู้บริหาร → อนุมัติ → กลับมานักสังคมสงเคราะห์ → เปิดเคสที่อนุมัติ → "ยืนยันใช้สิทธิ" ซ้ำหลายครั้งเพื่อดูโควตาลดลงจริง</p>'+
    '<p><b>นัดหมาย (ใหม่):</b> แท็บ "นัดหมาย" → เลือกวันที่ → เช็คอินผู้ป่วยที่มาถึง (พร้อมลงนามยินยอม) → เปิด Timeline → ดำเนินการทีละขั้นตอนจนถึง "ประเมิน" ซึ่งจะดึงผลประเมินครั้งก่อนมาเทียบและใช้สิทธิจริงให้อัตโนมัติ</p>'+
    '<p><b>ติดตาม (ใหม่):</b> แท็บ "ติดตาม" → รายชื่อที่ต้องเยี่ยมบ้าน → บันทึกเยี่ยมบ้าน (พร้อมปรับปรุงผลประเมินและลงนามยินยอม) → รายชื่อจะหายไปจากรายการหลังบันทึกสำเร็จ</p>'+
    '<p class="muted">ดูรายละเอียดครบใน START_HERE.md ที่แนบมาพร้อมไฟล์นี้</p>'+
  '</div><div class="modal-foot"><button class="btn btn--primary" onclick="closeModal()">เข้าใจแล้ว</button></div>';
  openModal(html);
}
function openModal(html,wide){ const o=document.getElementById('modalOverlay'); o.innerHTML='<div class="modal'+(wide?' modal--wide':'')+'">'+html+'</div>'; o.classList.add('is-open'); hydrateIcons(o); }
function closeModal(){ document.getElementById('modalOverlay').classList.remove('is-open'); document.getElementById('modalOverlay').innerHTML=''; }
</script>
